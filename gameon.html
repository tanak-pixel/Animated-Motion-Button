<!doctype html>
<!-- gameon.html
     Purpose: Simulate the "Game On" state. A button on this page leads to "Game Over".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Game On</title>
  </head>
  <body>

    <h1 style="position:fixed; top:18px; left:18px;">Game On</h1>

    <!-- Button advances to Game Over for the demo -->
    <a href="gameover.html" class="button" aria-label="Game Over">
      <span class="button__text"> game over </span>
      <img src="img/cone.png" alt="cone" class="button__cone" />
      <img src="img/torus.png" alt="torus" class="button__torus" />
      <img src="img/icosahedron.png" alt="icosahedron" class="button__icosahedron" />
      <img src="img/sphere.png" alt="sphere" class="button__sphere" />
    </a>

    <nav class="nav-sample">
      <a href="index.html">Play</a>
      <a href="level1.html">Level 1</a>
      <a href="gameover.html">Game Over</a>
    </nav>

  </body>
</html>
