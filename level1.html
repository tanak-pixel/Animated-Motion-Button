<!doctype html>
<!-- level1.html
     Purpose: A simple page representing "Level 1". Includes a sample button and
     links back to the main play page and to other demo pages.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Level 1</title>
  </head>
  <body>

    <h1 style="position:fixed; top:18px; left:18px;">Level 1</h1>

    <!-- Reuse the animated button as a navigation control -->
    <a href="gameon.html" class="button" aria-label="Start Level 1">
      <span class="button__text"> game on </span>
      <img src="img/cone.png" alt="cone" class="button__cone" />
      <img src="img/torus.png" alt="torus" class="button__torus" />
      <img src="img/icosahedron.png" alt="icosahedron" class="button__icosahedron" />
      <img src="img/sphere.png" alt="sphere" class="button__sphere" />
    </a>

    <nav class="nav-sample">
      <a href="index.html">Play</a>
      <a href="gameon.html">Game On</a>
      <a href="gameover.html">Game Over</a>
    </nav>

  </body>
</html>
